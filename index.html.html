<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Metal Scroll | 金屬卷軸 — 活動月曆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #eef0f7;
            background-image:
                radial-gradient(circle at 12% 10%, rgba(67, 56, 202, 0.14) 0%, transparent 42%),
                radial-gradient(circle at 88% 18%, rgba(30, 58, 138, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, rgba(238, 240, 247, 0.92) 0%, rgba(244, 241, 234, 0.95) 100%);
            color: #1e2538;
        }

        .glass-indigo-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.86) 0%, rgba(224, 231, 255, 0.52) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(67, 56, 202, 0.18);
        }

        .scroll-frame {
            position: relative;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(55, 48, 163, 0.18);
            box-shadow: 0 14px 36px -18px rgba(30, 41, 59, 0.22);
        }

        .scroll-frame::before,
        .scroll-frame::after {
            content: "";
            position: absolute;
            top: 18px;
            bottom: 18px;
            width: 5px;
            border-radius: 999px;
            background: linear-gradient(
                180deg,
                rgba(55, 48, 163, 0.45) 0%,
                rgba(180, 172, 154, 0.55) 50%,
                rgba(55, 48, 163, 0.45) 100%
            );
            pointer-events: none;
        }

        .scroll-frame::before { left: 8px; }
        .scroll-frame::after { right: 8px; }

        .day-cell {
            position: relative;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(79, 70, 229, 0.14);
            transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
        }

        .day-cell:hover {
            border-color: rgba(55, 48, 163, 0.38);
            background: rgba(238, 242, 255, 0.72);
        }

        .day-cell.other-month {
            background: rgba(244, 241, 234, 0.55);
            border-color: rgba(148, 163, 184, 0.18);
        }

        .day-cell::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 14px;
            height: 14px;
            border-top: 2px solid rgba(67, 56, 202, 0.28);
            border-left: 2px solid rgba(67, 56, 202, 0.28);
            border-top-left-radius: 10px;
            pointer-events: none;
        }

        .event-item:hover .event-popover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="glass-indigo-panel flex flex-col md:flex-row justify-between items-center mb-6 p-6 rounded-2xl shadow-sm gap-4">
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex flex-col items-center justify-center w-11 h-11 rounded-xl bg-indigo-900/10 border border-indigo-800/20 text-indigo-900 font-mono text-xs font-bold tracking-tighter select-none">
                    <span>SCROLL</span>
                    <span class="w-5 h-[1.5px] bg-indigo-800/40 my-0.5"></span>
                    <span>2026</span>
                </div>
                <div>
                    <div class="inline-flex items-center gap-2 text-[11px] font-semibold tracking-widest uppercase text-indigo-800/80 bg-indigo-100/70 px-2.5 py-0.5 rounded-full mb-1">
                        <span>LIVE DISPATCH</span>
                        <span>•</span>
                        <span>EVENT CALENDAR</span>
                    </div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide text-indigo-950">
                        The Metal Scroll <span class="text-indigo-700/50 mx-1">|</span> <span class="text-indigo-900">金屬卷軸</span>
                    </h1>
                    <p class="text-sm text-slate-600 mt-0.5">全台金屬音樂演出行事曆</p>
                </div>
            </div>

            <div class="flex items-center space-x-2.5 bg-white/70 border border-indigo-900/15 px-3 py-2 rounded-xl">
                <button type="button" onclick="changeMonth(-1)" class="px-3 py-1.5 bg-indigo-900/10 hover:bg-indigo-900/20 text-indigo-950 rounded-lg text-sm font-semibold transition">
                    &larr; 上個月
                </button>
                <h2 id="currentMonthTitle" class="text-base md:text-lg font-bold text-indigo-950 w-32 text-center">
                    2026年 11月
                </h2>
                <button type="button" onclick="changeMonth(1)" class="px-3 py-1.5 bg-indigo-900/10 hover:bg-indigo-900/20 text-indigo-950 rounded-lg text-sm font-semibold transition">
                    下個月 &rarr;
                </button>
            </div>
        </header>

        <main class="scroll-frame rounded-2xl p-5 md:p-7 overflow-visible">
            <div class="flex items-center justify-between text-xs text-indigo-950/65 mb-4 px-1">
                <span class="font-medium tracking-wide">▣ 滑鼠移至演出項目可查看完整資訊與售票連結</span>
                <span class="hidden sm:inline font-mono text-[11px] bg-[#f4f1ea] border border-stone-300/70 px-2.5 py-0.5 rounded-md">
                    INDIGO SHEER x RICE GREY
                </span>
            </div>

            <div class="grid grid-cols-7 gap-2 text-center font-bold text-xs md:text-sm mb-3">
                <div class="py-1.5 rounded-lg bg-indigo-900/10 text-indigo-900">日</div>
                <div class="py-1.5 rounded-lg bg-[#f4f1ea]/80 text-slate-600">一</div>
                <div class="py-1.5 rounded-lg bg-[#f4f1ea]/80 text-slate-600">二</div>
                <div class="py-1.5 rounded-lg bg-[#f4f1ea]/80 text-slate-600">三</div>
                <div class="py-1.5 rounded-lg bg-[#f4f1ea]/80 text-slate-600">四</div>
                <div class="py-1.5 rounded-lg bg-[#f4f1ea]/80 text-slate-600">五</div>
                <div class="py-1.5 rounded-lg bg-indigo-900/10 text-indigo-900">六</div>
            </div>

            <div id="calendarGrid" class="grid grid-cols-7 gap-2 overflow-visible"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://ybbwdtndrnnvfkeiclji.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K7iIa_1ztydOrYUrO465DA_nqwN_K_6';

        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth();
        let eventsData = [];

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function parseLineupTags(lineupStr) {
            return String(lineupStr || '')
                .split(/[,，、/|]+/)
                .map(function(b) { return b.trim(); })
                .filter(Boolean);
        }

        async function fetchEvents() {
            if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                console.warn('Supabase SDK 尚未載入，先顯示空月曆');
                eventsData = [];
                return;
            }
            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const { data, error } = await supabaseClient
                    .from('mp_events')
                    .select('*, mp_venues(name, county), mp_event_sources(source_url)')
                    .eq('status', 'published');

                if (error) throw error;
                eventsData = data || [];
            } catch (err) {
                console.error('載入活動失敗:', err);
                eventsData = [];
            }
        }

        function renderCalendar() {
            const titleEl = document.getElementById('currentMonthTitle');
            const gridEl = document.getElementById('calendarGrid');
            if (!titleEl || !gridEl) return;

            titleEl.textContent = currentYear + '年 ' + (currentMonth + 1) + '月';
            gridEl.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevTotalDays = new Date(currentYear, currentMonth, 0).getDate();

            for (let i = firstDayIndex; i > 0; i--) {
                const dayNum = prevTotalDays - i + 1;
                gridEl.appendChild(createCell(dayNum, true, ''));
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr =
                    currentYear + '-' +
                    String(currentMonth + 1).padStart(2, '0') + '-' +
                    String(day).padStart(2, '0');
                gridEl.appendChild(createCell(day, false, dateStr));
            }

            const totalCells = gridEl.children.length;
            const targetCells = totalCells <= 35 ? 35 : 42;
            for (let i = 1; i <= targetCells - totalCells; i++) {
                gridEl.appendChild(createCell(i, true, ''));
            }
        }

        function createCell(dayNum, isOtherMonth, dateStr) {
            const cell = document.createElement('div');
            cell.className =
                'day-cell min-h-[144px] rounded-xl p-2 flex flex-col justify-between overflow-visible ' +
                (isOtherMonth ? 'other-month text-slate-400' : 'text-slate-700');

            let eventsHtml = '';
            if (!isOtherMonth && dateStr) {
                const dayEvents = eventsData.filter(function(ev) {
                    return ev.start_date && String(ev.start_date).split('T')[0] === dateStr;
                });

                dayEvents.forEach(function(ev) {
                    const title = escapeHtml(ev.title || '');
                    const lineupRaw = ev.lineup || '';
                    const lineupEscaped = escapeHtml(lineupRaw);
                    const bands = parseLineupTags(lineupRaw);
                    const venueName = escapeHtml((ev.mp_venues && ev.mp_venues.name) || '未指定場地');
                    const county = escapeHtml((ev.mp_venues && ev.mp_venues.county) || '');
                    const rawUrl = (ev.mp_event_sources && ev.mp_event_sources[0] && ev.mp_event_sources[0].source_url) || '#';
                    const sourceUrl = escapeHtml(rawUrl);
                    const startDisplay = escapeHtml(String(ev.start_date || '').replace('T', ' ').slice(0, 16));
                    const endDisplay = escapeHtml(ev.end_date || '');

                    const tagsHtml = bands
                        .map(function(band) {
                            return '<span class="inline-block bg-[#f4f1ea] text-indigo-950 border border-indigo-900/20 text-[11px] font-medium px-1.5 py-0.5 rounded">' + escapeHtml(band) + '</span>';
                        })
                        .join('');

                    const popoverTagsHtml = bands
                        .map(function(band) {
                            return '<span class="inline-block bg-[#f4f1ea] text-indigo-950 border border-indigo-900/20 text-xs font-medium px-2 py-0.5 rounded-md">' + escapeHtml(band) + '</span>';
                        })
                        .join('');

                    eventsHtml +=
                        '<div class="event-item relative bg-indigo-900/[0.07] border border-indigo-800/20 rounded-lg p-2 mb-2 hover:z-30 transition">' +
                            '<a href="' + sourceUrl + '" target="_blank" rel="noopener noreferrer" class="block text-xs font-bold text-indigo-950 hover:text-indigo-700 hover:underline leading-snug break-words mb-1.5">' +
                                '&#9672; ' + title +
                            '</a>' +
                            '<div class="flex flex-wrap gap-1">' + tagsHtml + '</div>' +
                            '<div class="event-popover opacity-0 invisible translate-y-1 pointer-events-none hover:pointer-events-auto transition-all duration-150 absolute left-0 top-full mt-1.5 w-72 sm:w-80 bg-white/95 backdrop-blur-md border border-indigo-900/20 rounded-xl shadow-2xl p-4 z-50 text-left">' +
                                '<div class="text-xs font-semibold text-indigo-800 mb-1">' + (county ? county + ' · ' : '') + venueName + '</div>' +
                                '<div class="text-sm font-bold text-slate-900 leading-snug mb-2 break-words">' + title + '</div>' +
                                '<div class="text-xs text-slate-500 mb-2.5">日期：' + startDisplay + (endDisplay && endDisplay !== dateStr ? ' ～ ' + endDisplay : '') + '</div>' +
                                '<div class="mb-3">' +
                                    '<div class="text-[11px] font-semibold text-slate-500 mb-1">演出陣容</div>' +
                                    '<div class="flex flex-wrap gap-1.5">' + (popoverTagsHtml || ('<span class="text-xs text-slate-600">' + lineupEscaped + '</span>')) + '</div>' +
                                '</div>' +
                                (rawUrl !== '#'
                                    ? '<a href="' + sourceUrl + '" target="_blank" rel="noopener noreferrer" class="inline-block w-full text-center bg-indigo-900 hover:bg-indigo-800 text-white text-xs font-semibold py-1.5 rounded-lg transition">前往售票 / 活動頁 &rarr;</a>'
                                    : '') +
                            '</div>' +
                        '</div>';
                });
            }

            cell.innerHTML =
                '<div class="text-right text-xs font-semibold mb-1 ' + (isOtherMonth ? 'text-slate-400' : 'text-indigo-950/75') + '">' + dayNum + '</div>' +
                '<div class="space-y-1">' + eventsHtml + '</div>';
            return cell;
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        document.addEventListener('DOMContentLoaded', async function() {
            renderCalendar();
            await fetchEvents();
            renderCalendar();
        });
    </script>
</body>
</html>
