<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主辦活動自主投稿 | Metal Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-xl w-full bg-white border border-slate-200 rounded-2xl shadow-xl p-6 md:p-8">
        <header class="mb-6 border-b border-slate-100 pb-4">
            <h1 class="text-2xl font-bold tracking-wider text-rose-600">METAL PULSE</h1>
            <p class="text-sm text-slate-500 mt-1">金屬音樂活動主辦自主投稿表單</p>
        </header>

        <form id="submitForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">活動名稱</label>
                <input type="text" id="title" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none" placeholder="例：大港開唱">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">演出陣容 (樂團名稱)</label>
                <input type="text" id="lineup" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none" placeholder="例：血肉果汁機, 閃靈">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">開始日期與時間</label>
                    <input type="datetime-local" id="startDate" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        結束日期 <span class="text-xs font-normal text-slate-400">(*若表演只有一天則不用填)</span>
                    </label>
                    <input type="date" id="endDate" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">城市</label>
                    <input type="text" id="county" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none" placeholder="例：台北市">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">場地名稱</label>
                    <input type="text" id="venueName" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none" placeholder="例：Legacy Taipei">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">售票連結</label>
                <input type="url" id="sourceUrl" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none" placeholder="https://...">
            </div>

            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-lg transition shadow-md shadow-rose-600/20 mt-4">
                立即送出活動（等待後台審核）
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ybbwdtndrnnvfkeiclji.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K7iIa_1ztydOrYUrO465DA_nqwN_K_6';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('submitForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const lineup = document.getElementById('lineup').value;
            const startDateTime = document.getElementById('startDate').value;
            let endDate = document.getElementById('endDate').value;
            const county = document.getElementById('county').value;
            const venueName = document.getElementById('venueName').value.trim();
            const sourceUrl = document.getElementById('sourceUrl').value;

            if (!endDate) {
                endDate = startDateTime.split('T')[0];
            }

            try {
                // 1. 建立或取得場地
                let { data: venueData, error: venueErr } = await supabaseClient
                    .from('mp_venues')
                    .select('id')
                    .eq('name', venueName)
                    .maybeSingle();

                let venueId;
                if (venueErr) throw venueErr;

                if (!venueData) {
                    let { data: newVenue, error: insErr } = await supabaseClient
                        .from('mp_venues')
                        .insert([{ name: venueName, county: county }])
                        .select('id')
                        .single();
                    if (insErr) throw insErr;
                    venueId = newVenue.id;
                } else {
                    venueId = venueData.id;
                }

                // 2. 建立活動
                let { data: eventData, error: eventErr } = await supabaseClient
                    .from('mp_events')
                    .insert([{
                        title: title,
                        lineup: lineup,
                        start_date: startDateTime,
                        end_date: endDate,
                        venue_id: venueId,
                        status: 'pending'
                    }])
                    .select('id')
                    .single();

                if (eventErr) throw eventErr;

                // 3. 建立售票來源
                let { error: sourceErr } = await supabaseClient
                    .from('mp_event_sources')
                    .insert([{
                        event_id: eventData.id,
                        source_url: sourceUrl
                    }]);

                if (sourceErr) throw sourceErr;

                alert('活動投稿成功！已送至後台等待審核。');
                document.getElementById('submitForm').reset();
            } catch (err) {
                alert('投稿失敗：' + err.message);
                console.error(err);
            }
        });
    </script>
</body>
</html>
